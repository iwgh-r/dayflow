name: Verify Dayflow
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Core and UI tests, Android checks, Windows bundle
        run: .\gradlew.bat :core:test :composeApp:desktopTest :composeApp:assembleDebug :composeApp:lintDebug :composeApp:createDistributable --stacktrace
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-build-and-test-evidence
          path: |
            core/build/reports/
            composeApp/build/reports/
            composeApp/build/ui-evidence/
            composeApp/build/outputs/apk/debug/
            composeApp/build/compose/binaries/main/app/
          retention-days: 7
